<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연혁 플로우 — 뷰어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --panel:#fffdf9; --ink:#1f1b16; --sub:#6b6359; --line:#e3dcd1;
  --accent:#8a3b2a; --accent-soft:#f3e3dd; --radius:10px;
  --hdr:58px; --laneW:116px; --topH:56px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header{height:var(--hdr);background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}
.title-wrap{flex:1;min-width:160px;display:flex;align-items:baseline;gap:14px;overflow:hidden}
#worldName{font-family:'Noto Serif KR',serif;font-weight:800;font-size:20px;border:none;background:transparent;min-width:120px;max-width:340px;padding:2px 0;outline:none}
#worldName:focus{border-bottom:1px dashed var(--sub)}
.meta{color:var(--sub);font-size:12px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.meta input{width:84px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:#fff}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--sub)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:#b3261e}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:none;background:transparent;padding:5px 10px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}

.app{display:flex;height:calc(100% - var(--hdr))}
aside{width:250px;flex:none;border-right:1px solid var(--line);background:var(--bg);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
aside.hide{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.card h3{margin:0 0 8px;font-size:12px;color:var(--sub);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;background:#fff;user-select:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip small{opacity:.6}
.era-item{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;cursor:pointer}
.era-item:hover{background:var(--accent-soft)}
.swatch{width:11px;height:11px;border-radius:3px;flex:none}
.era-item .name{flex:1;font-weight:500}
.era-item .range{color:var(--sub);font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
.stats b{display:block;font-size:17px;font-family:'Noto Serif KR',serif}
.stats span{font-size:11px;color:var(--sub)}
.hint{font-size:11px;color:var(--sub)}

.stage{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar label.meta select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff}

/* flow board */
.board{flex:1;display:grid;grid-template-columns:var(--laneW) 1fr;grid-template-rows:var(--topH) 1fr;min-height:0;position:relative}
.corner{background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;color:var(--sub);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;gap:2px}
.topbar{position:relative;overflow:hidden;background:var(--panel);border-bottom:1px solid var(--line)}
.lanebar{position:relative;overflow:hidden;background:var(--panel);border-right:1px solid var(--line)}
.viewport{overflow:auto;position:relative;cursor:grab;background:
  radial-gradient(circle,#ddd5c8 1px,transparent 1.2px) 0 0/22px 22px, var(--bg)}
.viewport.panning{cursor:grabbing}
.sizer{position:relative}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.era-bg{position:absolute;top:0;bottom:0;opacity:.07}
.era-sep{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(0,0,0,.18)}
.lane-bg{position:absolute;left:0;right:0;border-bottom:1px solid rgba(0,0,0,.06)}
.lane-bg.alt{background:rgba(255,255,255,.45)}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:#9b9083;stroke-width:1.8}
.edge-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.edge-g.hl .edge,.edge-g:hover .edge{stroke:var(--accent);stroke-width:2.6}
.edge-g.dim{opacity:.15}
.edge-label{font-size:11px;fill:#5a5148;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.edge-g.hl .edge-label{fill:var(--accent)}
.temp-edge{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}

.node{position:absolute;background:var(--panel);border:1px solid #d6cdbf;border-top:4px solid var(--c);border-radius:9px;padding:7px 10px 6px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);user-select:none;transition:box-shadow .15s,opacity .15s}
.node:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:3}
.node.imp3{border:2px solid var(--c);border-top-width:5px;box-shadow:0 2px 10px rgba(138,59,42,.18)}
.node.imp2 .n-title{font-weight:700}
.node.dim{opacity:.22}
.node.dragging{box-shadow:0 10px 24px rgba(0,0,0,.2);z-index:10;cursor:grabbing;transition:none}
.node.flash{animation:flash 1.3s}
@keyframes flash{0%,50%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 1px 3px rgba(0,0,0,.06)}}
.n-top{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--sub)}
.n-yr{font-family:'Noto Serif KR',serif;font-weight:600;color:var(--ink)}
.n-cat{color:var(--c);font-weight:500}
.n-title{font-weight:500;font-size:13.5px;line-height:1.35;margin:3px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node.imp3 .n-title{font-weight:800}
.n-sub{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.port{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#fff;border:2px solid #b5aa9b}
.port.out{right:-8px;cursor:crosshair;opacity:0;transition:opacity .15s}
.port.in{left:-8px;opacity:0;pointer-events:none}
.node:hover .port.out,.board.connecting .port.in{opacity:1}
.port.out:hover{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.2)}
.board.connecting .node:hover{box-shadow:0 0 0 3px var(--accent)}

.era-tag{position:absolute;top:4px;height:22px;border-radius:5px;color:#fff;font-size:12px;font-weight:500;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.yr-tick{position:absolute;top:31px;transform:translateX(-50%);font-family:'Noto Serif KR',serif;font-size:12px;font-weight:600;white-space:nowrap}
.gap-tick{position:absolute;top:34px;transform:translateX(-50%);font-size:10px;color:#a39888;white-space:nowrap}
.lane-tag{position:absolute;left:0;right:0;padding:8px 10px;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);cursor:pointer}
.lane-tag span{font-weight:400;font-size:11px;color:var(--sub)}
.lane-tag:hover{background:var(--accent-soft)}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:5;align-items:center}
.zoom span{font-size:12px;width:44px;text-align:center;color:var(--sub)}
.helpbox{position:absolute;left:calc(var(--laneW) + 14px);right:250px;bottom:14px;padding-right:28px !important;font-size:11.5px;color:var(--sub);background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:8px;padding:6px 10px;z-index:5;line-height:1.6}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--sub);pointer-events:none}
.empty .btn{pointer-events:auto}

.tablewrap{flex:1;overflow:auto;padding:14px}
.table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
.table th,.table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.table th{background:#f1ece4;font-size:12px;color:var(--sub);position:sticky;top:0}
.table tr:hover td{background:#fbf8f3;cursor:pointer}

/* characters */
.char-row{display:flex;align-items:center;gap:7px;padding:5px 4px;border-radius:6px;cursor:pointer}
.char-row:hover{background:var(--accent-soft)}
.char-row.on{background:var(--ink);color:#fff}
.char-row.on .cr{color:#ddd}
.cdot{width:10px;height:10px;border-radius:50%;flex:none}
.char-row .cn{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.char-row .cr{font-size:11px;color:var(--sub)}
.char-row .ed{opacity:0;font-size:12px;padding:0 4px;border:none;background:transparent;cursor:pointer;color:inherit}
.char-row:hover .ed{opacity:.7}
.focusbar{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--fc,#8a3b2a);color:#fff;font-size:13px}
.focusbar.show{display:flex}
.focusbar .btn{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);color:#fff}
.thread{fill:none;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.28}
.age{position:absolute;top:-11px;right:8px;font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:1px 7px;white-space:nowrap}
.charwrap{flex:1;overflow:auto;padding:16px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--radius);padding:12px 14px;cursor:pointer}
.ccard:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.ccard h4{margin:0;font-family:'Noto Serif KR',serif;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ccard h4 small{font-family:'Noto Sans KR';font-size:11px;font-weight:500;color:var(--c)}
.ccard .cm{font-size:12px;color:var(--sub);margin:3px 0 6px}
.ccard .cd{font-size:13px;line-height:1.5;color:#3d362e;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ccard .cf{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.life{height:6px;border-radius:3px;background:#eee6da;position:relative;margin:6px 0 2px}
.life i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--c)}
.tag{font-size:11px;color:var(--sub);background:#f1ece4;border-radius:4px;padding:1px 6px}
.picker{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;min-height:38px}
.picker input{border:none !important;padding:3px 4px !important;flex:1;min-width:110px;outline:none;width:auto !important}
.pchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:2px 4px 2px 8px;background:#f1ece4}
.pchip b{font-weight:500}
.pchip button{border:none;background:transparent;cursor:pointer;padding:0 3px;color:var(--sub)}
.evlist .linkrow{cursor:pointer}
.evlist .linkrow:hover{background:var(--accent-soft)}
.evlist .yr{font-family:'Noto Serif KR',serif;font-weight:600;width:56px;flex:none}
.evlist .ag{font-size:11px;color:var(--sub);flex:none}
/* images */
.imgs{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:1px dashed var(--line);border-radius:10px;background:#fff;min-height:92px;transition:background .15s}
.imgs.drop{background:var(--accent-soft);border-color:var(--accent)}
.ith{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;cursor:zoom-in;background:#eee}
.ith img{width:100%;height:100%;object-fit:cover;display:block}
.ith .cv{position:absolute;left:4px;top:4px;font-size:10px;background:var(--accent);color:#fff;border-radius:4px;padding:0 5px}
.ith .ia{position:absolute;right:3px;top:3px;display:none;gap:3px}
.ith:hover .ia{display:flex}
.ith .ia button{border:none;width:22px;height:22px;border-radius:5px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:11px;padding:0}
.iadd{width:84px;height:84px;border-radius:8px;border:1px dashed #c9bfb1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub);cursor:pointer;gap:2px;text-align:center;line-height:1.3}
.iadd b{font-size:20px;font-weight:400}
.iadd:hover{border-color:var(--accent);color:var(--accent)}
.node.has-img{padding-left:70px}
.node .n-img{position:absolute;left:7px;top:7px;width:56px;height:calc(100% - 14px);border-radius:6px;object-fit:cover;background:#eee}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;flex:none;color:#fff;font-weight:700;vertical-align:middle;overflow:hidden}
.n-sub .av{margin-right:3px}
.ccard .ch{display:flex;gap:10px;align-items:center}
.ccard .ch .av{cursor:zoom-in}
.ccard .ch>div{flex:1;min-width:0}
.ccard .strip{display:flex;gap:4px;margin-top:8px}
.ccard .strip img{width:42px;height:42px;border-radius:5px;object-fit:cover;cursor:zoom-in}
.tip img{display:block;max-width:240px;max-height:180px;border-radius:4px;margin-bottom:6px}
.tthumb{width:44px;height:44px;border-radius:6px;object-fit:cover;cursor:zoom-in;display:block}
#lb{position:fixed;inset:0;background:rgba(12,10,8,.92);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#lb.show{display:flex}
#lb img{max-width:92vw;max-height:80vh;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);user-select:none}
#lb .cap{margin-top:12px;font-size:14px;opacity:.9}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer}
#lb .nav:hover{background:rgba(255,255,255,.25)}
#lb .prev{left:20px}#lb .next{right:20px}
#lb .x{position:absolute;right:18px;top:14px;border:none;background:transparent;color:#fff;font-size:26px;cursor:pointer}
#lb .dots{display:flex;gap:6px;margin-top:10px}
#lb .dots img{width:48px;height:48px;object-fit:cover;border-radius:5px;opacity:.5;cursor:pointer;box-shadow:none}
#lb .dots img.on{opacity:1;outline:2px solid #fff}
.drop-hint{position:absolute;z-index:20;background:var(--ink);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;pointer-events:none;transform:translate(-50%,-100%)}
.drop-hint b{color:#ffd9a8}
.drop-guide{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--accent);pointer-events:none;z-index:1}
.drop-slot{position:absolute;border:2px dashed var(--accent);border-radius:9px;background:rgba(138,59,42,.06);pointer-events:none}
.board.free .lanebar{background:var(--panel)}
.free-note{position:absolute;left:12px;top:20px;font-size:12px;color:var(--sub);white-space:nowrap}
.tidy{position:absolute;right:14px;top:10px;z-index:9;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:12px 14px;display:none}
.tidy.show{display:block}
.tidy h4{margin:0 0 10px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.tidy h4 .hint{font-weight:400}
.tidy label{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:8px}
.tidy select{grid-column:span 2;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff;font-size:12px}
.tidy input[type=range]{accent-color:var(--accent);width:100%}
.tidy b{font-size:12px;color:var(--ink);width:36px;text-align:right}
.sguide{position:absolute;pointer-events:none;z-index:15;background:#e5484d}
.sguide.v{width:1px;top:0;bottom:0}.sguide.h{height:1px;left:0;right:0}
.edge-g.sel .edge{stroke:var(--accent);stroke-width:2.8}
.edge-g.sel .edge-label{fill:var(--accent)}
.ehs .eh{fill:#fff;stroke:var(--accent);stroke-width:2.5;pointer-events:all;cursor:grab}
.ehs .eh.mid{fill:var(--accent);stroke:#fff}
.ehs .eh:hover{r:9}
.edge-g.moving{opacity:.25}
.edge-bar{position:absolute;transform:translateX(-50%);z-index:12;display:flex;gap:2px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px 4px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.edge-bar input{border:1px solid var(--line);border-radius:6px;padding:3px 7px;width:130px;font-size:12px}
.ro-only{display:none}
body.ro .ro-only{display:inline-flex}
body.ro header>.btn:not(.ro-only):not(.ghost),body.ro header .btn.ghost[onclick="openTerms()"],body.ro #arrSeg,body.ro #tidyBtn,body.ro #resetPosBtn,body.ro #laneEditBtn,body.ro .char-row .ed,body.ro .card h3 .btn,body.ro .port,body.ro .empty .btn,body.ro #helpbox{display:none !important}
body.ro #worldName,body.ro #calName{pointer-events:none}
body.ro .title-wrap .meta{display:none}
body.ro .node{cursor:pointer}
.dt-imgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dt-imgs img{width:96px;height:96px;object-fit:cover;border-radius:8px;cursor:zoom-in}
.dt-meta{font-size:12px;color:var(--c,var(--sub));font-weight:500}
#detailBody h2{margin:4px 0 8px}
#detailBody h5{margin:14px 0 6px;font-size:12px;color:var(--sub)}
.dt-desc{white-space:pre-wrap;line-height:1.65;margin:6px 0;color:#3d362e}
#detailBody .chip small{opacity:.65}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;z-index:150;display:none;max-width:280px;line-height:1.5;white-space:pre-wrap}
.modal-bg{position:fixed;inset:0;background:rgba(20,16,12,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:580px;max-height:92vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 14px;font-family:'Noto Serif KR',serif;font-size:18px}
.field{margin-bottom:12px}
.field>label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.field textarea{min-height:80px;resize:vertical;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.inline{display:flex;gap:6px}
.inline select{flex:2}.inline input{flex:1.3}
.linkrow{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#f6f1ea;border-radius:7px;margin-bottom:5px;font-size:13px}
.linkrow .to{flex:1}
.linkrow input{width:130px;flex:none;padding:3px 7px !important}
.linkrow.in{background:transparent;border:1px dashed var(--line);color:var(--sub)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.actions .left{margin-right:auto}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:200}
@media (max-width:760px){aside{position:absolute;z-index:30;height:calc(100% - var(--hdr));box-shadow:4px 0 16px rgba(0,0,0,.1)}.title-wrap .meta{display:none}:root{--laneW:84px}.helpbox{display:none}}
</style>
</head>
<body>
<header>
  <button class="btn ghost" onclick="toggleSide()" title="필터 패널">☰</button>
  <div class="title-wrap">
    <input id="worldName" placeholder="보드 이름" />
    <div class="meta">연도 앞 표기 <input id="calName" /></div>
  </div>

<script>window.READONLY_MODE=true;</script>
<script>
const KEY='worldline-v2', OLDKEY='worldline-v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const NW=184, NH=86, GAPX=74, COLW=NW+GAPX, ROWG=12, LPAD=16, PADX=36;
const NOLANE='기타';
const CPAL=['#c0392b','#2e86c1','#d68910','#7d3c98','#17a589','#c2185b','#5d6d7e','#6e8b3d'];

function normalize(d){
  const OLDC=['건국','전쟁','정치','인물','문화','재해','신화'];d.cats=(!d.cats?.length||d.cats.join()===OLDC.join())?['시작','변화','결정','갈등','성과','위기','기타']:d.cats;
  d.lanes=d.lanes||[]; d.eras=d.eras||[]; d.events=d.events||[];
  d.eras.forEach(e=>e.id=e.id||uid());
  d.events.forEach(e=>{e.id=e.id||uid();e.year=+e.year||0;e.imp=+e.imp||1;e.people=e.people||[];e.places=e.places||[];e.links=(e.links||[]).filter(l=>l&&l.to);e.lane=e.lane||'';e.imgs=e.imgs||[]});
  if(d.free===undefined)d.free=true;
  d.chars=(d.chars||[]).map(c=>({id:c.id||uid(),name:c.name,role:c.role||'',faction:c.faction||'',born:c.born??null,died:c.died??null,color:c.color||CPAL[0],desc:c.desc||'',rels:(c.rels||[]).filter(r=>r&&r.to),imgs:c.imgs||[]})).filter(c=>c.name);
  d.events.forEach(e=>e.people.forEach(n=>{if(!d.chars.some(c=>c.name===n))d.chars.push({id:uid(),name:n,role:'',faction:'',born:null,died:null,color:CPAL[d.chars.length%CPAL.length],desc:'',rels:[]})}));
  return d;
}
const SAMPLE_EV=['세계수의 개화','용족의 퇴장','아르덴 왕국 건국','마법 학원 설립','왕립 마법 학원 설립','북방 전쟁','왕궁의 밤','왕위 계승 전쟁','마법 금지령','주인공 탄생','주인공 리아 탄생','리아, 왕도로 향하다'];
const SAMPLE_ERA=['태초의 시대','왕국 시대','분열의 시대'], SAMPLE_LANE=['신화','왕가','마법사회','주인공'];
const SAMPLE_PPL=['용왕 바르그','레온 1세','대마법사 엘린','장군 카이로스','레온 7세','리아','카이로스'];
function stripSample(d){ // 예시 데이터 1회 정리
  if(!d||d.cleaned) return d;
  const gone=new Set(d.events.filter(e=>SAMPLE_EV.includes(e.title)).map(e=>e.id));
  d.events=d.events.filter(e=>!gone.has(e.id));
  d.events.forEach(e=>{e.links=(e.links||[]).filter(l=>!gone.has(l.to))});
  d.eras=(d.eras||[]).filter(e=>!SAMPLE_ERA.includes(e.name));
  const used=new Set(d.events.map(e=>e.lane));
  d.lanes=(d.lanes||[]).filter(l=>!SAMPLE_LANE.includes(l)||used.has(l));
  const usedP=new Set(d.events.flatMap(e=>e.people||[]));
  d.chars=(d.chars||[]).filter(c=>!SAMPLE_PPL.includes(c.name)||usedP.has(c.name));
  if(d.name==='아르덴 연대기')d.name='';
  if(d.cal==='왕국력')d.cal='';
  d.cleaned=true; return d;
}
const READONLY=window.READONLY_MODE===true;
let D=null;
if(!READONLY)for(const k of [KEY,OLDKEY]){try{const o=JSON.parse(localStorage.getItem(k));if(o&&o.events){D=o;if(k===OLDKEY)o.events.forEach(e=>e.lane=e.lane||'');break}}catch(e){}}
D=normalize(stripSample(D?normalize(D):null)||{name:'',cal:'',lanes:[],eras:[],events:[],chars:[],cleaned:true});
let F={cats:new Set(),places:new Set(),focus:null,imp:1,view:'flow',laneMode:'lane'};
let Z=1, POS={}, LANES=[], COLS=[], editingEv=null, tmpLinks=[], editingEra=null, ioFmt='json', listKey='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT_TERMS={era:'구간',item:'항목',who:'참여자',group:'그룹',cat:'분류',tag:'태그',age:'elapsed'};

function matches(e){

  if(F.focus){const c=charById(F.focus);if(c&&!e.people.includes(c.name))return false}
  if(F.places.size&&!e.places.some(p=>F.places.has(p))) return false;

/* ---------- layout ---------- */
function layout(){
  D.eras.sort((a,b)=>a.start-b.start);
  const evs=[...D.events].sort((a,b)=>a.year-b.year);
  // lanes
  let base=F.laneMode==='cat'?[...D.cats]:F.laneMode==='none'?['전체']:[...D.lanes];
  evs.forEach(e=>{const k=laneKey(e);if(!base.includes(k))base.push(k)});
  if(F.laneMode==='cat') base=base.filter(k=>evs.some(e=>laneKey(e)===k));
  if(!base.length) base=['전체'];
  // columns = unique years, + empty eras
  const ys=new Set(evs.map(e=>e.year));
  D.eras.forEach(er=>{if(!evs.some(e=>e.year>=er.start&&e.year<=er.end))ys.add(er.start)});
  COLS=[...ys].sort((a,b)=>a-b);
  const ci=new Map(COLS.map((y,i)=>[y,i]));
  // stack counts
  const cell={};
  evs.forEach(e=>{const k=laneKey(e)+'|'+e.year;(cell[k]=cell[k]||[]).push(e)});
  Object.values(cell).forEach(a=>a.sort((x,y)=>(x.ord??1e9)-(y.ord??1e9)));
  let y=0; LANES=base.map(k=>{
    let rows=1; COLS.forEach(c=>{const n=(cell[k+'|'+c]||[]).length;if(n>rows)rows=n});
    const h=LPAD*2+rows*NH+(rows-1)*ROWG; const L={key:k,y,h,count:evs.filter(e=>laneKey(e)===k).length}; y+=h; return L;
  });
  POS={};
  LANES.forEach(L=>COLS.forEach(c=>(cell[L.key+'|'+c]||[]).forEach((e,i)=>{POS[e.id]={x:PADX+ci.get(c)*COLW,y:L.y+LPAD+i*(NH+ROWG)}})));
  let W=PADX*2+Math.max(COLS.length,1)*COLW-GAPX, H=Math.max(y,200);
  if(D.free){D.events.forEach(e=>{if(e.fx!=null&&e.fy!=null)POS[e.id]={x:e.fx,y:e.fy}});if(PREVIEW)Object.entries(PREVIEW).forEach(([id,p])=>{if(POS[id])POS[id]=p});
    Object.values(POS).forEach(p=>{W=Math.max(W,p.x+NW+PADX+COLW);H=Math.max(H,p.y+NH+120)});}
  return {W,H};
}

function roundPath(pts,r){let d=`M${pts[0][0]},${pts[0][1]}`;

  return {fw:false,my,ox1,ox2,pts:[[x1,y1],[ox1,y1],[ox1,my],[ox2,my],[ox2,y2],[x2,y2]],hx:(ox1+ox2)/2,hy:my}}
/* 관계선 겹침 줄이기: 연결점 분산 + 세로/가로 구간 비켜가기 */
let ROUTES={},ASIG='',ACACHE={};
function routeAll(){routeAllHeur();try{routeAstar()}catch(err){console.warn(err)}}
function routeAllHeur(){

  E.forEach(r=>{(out[r.f]=out[r.f]||[]).push(r);(inn[r.t]=inn[r.t]||[]).push(r)});
  const spread=(arr,key,set)=>{arr.sort((a,b)=>key(a)-key(b));const n=arr.length,sp=n>1?Math.min(14,(NH-26)/(n-1)):0;arr.forEach((r,i)=>set(r,(i-(n-1)/2)*sp))};
  Object.values(out).forEach(a=>spread(a,r=>cy(r.t)+cx(r.t)*1e-4,(r,o)=>r.oy1=o));
  Object.values(inn).forEach(a=>spread(a,r=>cy(r.f)+cx(r.f)*1e-4,(r,o)=>r.oy2=o));
  E.forEach(r=>{r.x1=POS[r.f].x+NW;r.y1=cy(r.f)+r.oy1;r.x2=POS[r.t].x;r.y2=cy(r.t)+r.oy2;r.back=!(r.x2-r.x1>44)});
  // 뒤로 돌아가는 선: 같은 노드에서 나가고/들어오는 순서대로 세로 구간 간격
  const bk1={},bk2={};E.filter(r=>r.back).forEach(r=>{r.opt.k1=bk1[r.f]=(bk1[r.f]??-1)+1;r.opt.k2=bk2[r.t]=(bk2[r.t]??-1)+1});

  const RECT=Object.entries(POS).map(([id,p])=>({id,x1:p.x-8,x2:p.x+NW+8,y1:p.y-8,y2:p.y+NH+8}));
  const hHit=(y,a,b)=>RECT.some(n=>y>n.y1&&y<n.y2&&ov(a,b,n.x1,n.x2,0));
  const vHit=(x,a,b,skip)=>RECT.some(n=>!skip.includes(n.id)&&x>n.x1&&x<n.x2&&ov(a,b,n.y1,n.y2,0));

    const o=orthoPts(r.x1,r.y1,r.x2,r.y2,null,r.opt);if(o.straight){r.o=o;return}
    const a=Math.min(r.y1,r.y2),b=Math.max(r.y1,r.y2),lo=r.x1+11,hi=r.x2-11;let pick=null,soft=null;

function routeAstar(){

  const g=new Float64Array(N*4),came=new Int32Array(N*4),seen=new Uint32Array(N*4),closed=new Uint32Array(N*4);let cur=0;const G=s=>seen[s]===cur?g[s]:Infinity;

function tidyTargets(o){
  const S=TIDY.start,evs=D.events.filter(e=>S[e.id]),gx=COLW*o.g,gy=(NH+ROWG+10)*Math.max(.7,o.g),T={};
  if(o.h==='order'){const arr=[...evs].sort((a,b)=>S[a.id].x-S[b.id].x||a.year-b.year);let col=-1,cx=-1e9;arr.forEach(e=>{if(S[e.id].x-cx>NW*.5){col++;cx=S[e.id].x}T[e.id]={x:PADX+col*gx}})}
  else if(o.h==='time'){const ys=[...new Set(evs.map(e=>e.year))].sort((a,b)=>a-b),mn=ys[0],mx=ys[ys.length-1],span=Math.max(1,ys.length-1)*gx,X={};let prev=-1e9;ys.forEach(y=>{let x=PADX+(mx===mn?0:(y-mn)/(mx-mn)*span);x=Math.max(x,prev+NW+24*o.g);X[y]=x;prev=x});evs.forEach(e=>T[e.id]={x:X[e.year]})}
  else evs.forEach(e=>T[e.id]={x:S[e.id].x});
  if(o.v==='group'){let top=LPAD;const keys=[...LANES.map(L=>L.key)];evs.forEach(e=>{if(!keys.includes(laneKey(e)))keys.push(laneKey(e))});
    keys.forEach(k=>{const g=evs.filter(e=>laneKey(e)===k).sort((a,b)=>T[a.id].x-T[b.id].x||S[a.id].y-S[b.id].y);if(!g.length)return;const ends=[];
      g.forEach(e=>{let r=0;while(ends[r]!=null&&ends[r]>T[e.id].x-14)r++;ends[r]=T[e.id].x+NW;T[e.id].y=top+r*gy});top+=ends.length*gy+LPAD})}
  else if(o.v==='rows'){const arr=[...evs].sort((a,b)=>S[a.id].y-S[b.id].y);let row=-1,ry=-1e9;arr.forEach(e=>{if(S[e.id].y-ry>NH*.6){row++;ry=S[e.id].y}T[e.id].y=LPAD+row*gy})}
  else evs.forEach(e=>T[e.id].y=S[e.id].y);
  if(o.v!=='keep'||o.h!=='keep'){const placed=[];[...evs].sort((a,b)=>T[a.id].x-T[b.id].x||T[a.id].y-T[b.id].y).forEach(e=>{const t=T[e.id];let hit=true,n=0;
    while(hit&&n++<200){hit=false;for(const q of placed){if(Math.abs(q.x-t.x)<NW+12&&Math.abs(q.y-t.y)<NH+ROWG){t.y=q.y+gy;hit=true}}}placed.push(t)})}
  return T}
function tidyPreview(){const o=tidyOpts();$('td_pv').textContent=Math.round(o.p*100)+'%';$('td_gv').textContent=Math.round(o.g*100)+'%';
  const T=tidyTargets(o),S=TIDY.start;PREVIEW={};Object.keys(T).forEach(id=>{const a=S[id],b=T[id];PREVIEW[id]={x:Math.round(a.x+(b.x-a.x)*o.p),y:Math.round(a.y+(b.y-a.y)*o.p)}});renderFlow()}
['td_h','td_v','td_p','td_g'].forEach(id=>$(id).addEventListener('input',()=>TIDY&&tidyPreview()));
function tidyApply(){if(!PREVIEW)return;Object.entries(PREVIEW).forEach(([id,p])=>{const e=byId(id);if(e){e.fx=Math.max(0,p.x);e.fy=Math.max(0,p.y)}});
  const mx=Math.min(...Object.values(PREVIEW).map(p=>p.x)),my=Math.min(...Object.values(PREVIEW).map(p=>p.y));
  if(mx<PADX||my<LPAD)D.events.forEach(e=>{if(e.fx!=null){e.fx+=Math.max(0,PADX-mx);e.fy+=Math.max(0,LPAD-my)}});
  PREVIEW=null;TIDY=null;$('tidy').classList.remove('show');render();toast('정리했습니다')}
function tidyCancel(){PREVIEW=null;if(TIDY?.wasAuto)D.free=false;TIDY=null;$('tidy').classList.remove('show');render()}
let drag=null;

  if(e.button!==0)return;
  const port=e.target.closest('.port.out'), node=e.target.closest('.node'), hit=e.target.closest('.edge-hit');
  if(READONLY){drag={type:'pan',sx:e.clientX,sy:e.clientY,sl:$('vp').scrollLeft,st:$('vp').scrollTop,nodeId:node?.dataset.id,tgt:e.target};$('vp').classList.add('panning');$('vp').setPointerCapture(e.pointerId);return}

  drag={type:'pan',sx:e.clientX,sy:e.clientY,sl:$('vp').scrollLeft,st:$('vp').scrollTop};$('vp').classList.add('panning');$('vp').setPointerCapture(e.pointerId);
});
$('vp').addEventListener('pointermove',e=>{
  if(!drag)return;
  if(drag.type==='pan'){$('vp').scrollLeft=drag.sl-(e.clientX-drag.sx);$('vp').scrollTop=drag.st-(e.clientY-drag.sy)}
  else if(drag.type==='node'){if(!drag.moved&&Math.abs(e.clientY-drag.sy)+Math.abs(e.clientX-drag.sx)<5)return;
    let dx=(e.clientX-drag.sx)/Z,dy=(e.clientY-drag.sy)/Z;
    if(e.shiftKey){if(D.free){Math.abs(dx)>Math.abs(dy)?dy=0:dx=0}else dx=0}
    if(!D.free&&F.laneMode==='none'&&!e.shiftKey){} 
    drag.moved=true;drag.shift=e.shiftKey;drag.el.classList.add('dragging');let nx=drag.ox+dx,ny=drag.oy+dy;if(D.free){const g=smartSnap(drag.id,nx,ny,e.altKey);nx=g.x;ny=g.y;showGuides(g)}drag.el.style.left=nx+'px';drag.el.style.top=ny+'px';hideTip();
    if(!D.free)showDropHint(byId(drag.id),drag.ox+dx+NW/2,drag.oy+dy+NH/2,e.shiftKey)}
  else if(drag.type==='bend'){const l=linkOf(drag.from,drag.to);if(!l)return;drag.moved=true;l.bend={x:drag.b0.x+(e.clientX-drag.sx)/Z,y:drag.b0.y+(e.clientY-drag.sy)/Z};
    if(!drag.raf)drag.raf=requestAnimationFrame(()=>{if(drag)drag.raf=0;renderFlow()})}
  else if(drag.type==='reedge'){drag.moved=true;const p=toCanvas(e.clientX,e.clientY),te=$('tempEdge');te.style.display='';
    if(drag.role==='e'){const a=POS[drag.from],x1=a.x+NW,y1=a.y+NH/2,c=0;te.setAttribute('d',orthoD(x1,y1,p.x,p.y))}
    else{const b=POS[drag.to];te.setAttribute('d',orthoD(p.x,p.y,b.x,b.y+NH/2))}}
  else if(drag.type==='link'){const a=POS[drag.from],p=toCanvas(e.clientX,e.clientY);const te=$('tempEdge');te.style.display='';
    const x1=a.x+NW,y1=a.y+NH/2,c=0;te.setAttribute('d',orthoD(x1,y1,p.x,p.y))}
});
$('vp').addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;$('vp').classList.remove('panning');$('board').classList.remove('connecting');
  if(d.type==='pan'&&d.nodeId&&Math.abs(e.clientX-d.sx)+Math.abs(e.clientY-d.sy)<5){const ev=byId(d.nodeId);if(d.tgt.classList?.contains('n-img'))openLB(ev.imgs,0,ev.title);else openDetail(d.nodeId);return}
  if(d.type==='node'){
    if(!d.moved){if(d.tgt.classList?.contains('n-img')){const ev=byId(d.id);openLB(ev.imgs,0,ev.title)}else openEvent(d.id);return}
    const ev=byId(d.id),nx=parseFloat(d.el.style.left),ny=parseFloat(d.el.style.top);
    if(D.free){ev.fx=Math.max(0,Math.round(nx));ev.fy=Math.max(0,Math.round(ny));render();return}
    const r=computeDrop(ev,nx+NW/2,ny+NH/2,d.shift),msg=[];
    if(r.year!==ev.year){msg.push(`연도 ${shortYear(ev.year)} → ${shortYear(r.year)}`);ev.year=r.year}
    const L=r.L;
    if(L&&L.key!==laneKey(ev)&&F.laneMode!=='none'){
      if(F.laneMode==='cat'){if(L.key!==NOLANE)ev.cat=L.key}else ev.lane=L.key===NOLANE?'':L.key;
      if(F.laneMode==='lane'&&L.key!==NOLANE&&!D.lanes.includes(L.key))D.lanes.push(L.key);
      msg.push(`'${L.key}' ${tx(F.laneMode==='cat'?'{cat|으로/로}':'{group|으로/로}')}`);
    }
    const sib=D.events.filter(x=>x!==ev&&laneKey(x)===laneKey(ev)&&x.year===ev.year).sort((a,b)=>(a.ord??1e9)-(b.ord??1e9));
    sib.splice(Math.min(r.idx,sib.length),0,ev);sib.forEach((x,i)=>x.ord=i);
    if(msg.length)toast(msg.join(' · ')+' 옮겼습니다');
    render();
  } else if(d.type==='bend'){if(d.raf)cancelAnimationFrame(d.raf);render();
  } else if(d.type==='reedge'){
    $('tempEdge').style.display='none';
    const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.node'),l=linkOf(d.from,d.to);
    if(!l||!d.moved){renderFlow();return}
    if(!el){const src=byId(d.from);src.links=src.links.filter(x=>x!==l);SEL=null;render();toast('연결을 삭제했습니다');return}
    const nid=el.dataset.id;
    if(d.role==='e'){
      if(nid===d.from||nid===d.to){renderFlow();return}
      if(byId(d.from).links.some(x=>x.to===nid)){toast('이미 연결되어 있습니다');renderFlow();return}
      l.to=nid;delete l.bend;SEL={from:d.from,to:nid};toast('도착 항목을 바꿨습니다');
    }else{
      if(nid===d.to||nid===d.from){renderFlow();return}
      const ns=byId(nid);if(ns.links.some(x=>x.to===d.to)){toast('이미 연결되어 있습니다');renderFlow();return}
      const src=byId(d.from);src.links=src.links.filter(x=>x!==l);delete l.bend;ns.links.push(l);SEL={from:nid,to:d.to};toast('출발 항목을 바꿨습니다');
    }
    render();
  } else if(d.type==='link'){
    $('tempEdge').style.display='none';
    const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.node');
    if(el&&el.dataset.id!==d.from){const src=byId(d.from);
      if(src.links.some(l=>l.to===el.dataset.id))toast('이미 연결되어 있습니다');
      else{src.links.push({to:el.dataset.id,label:''});render();toast('연결했습니다 — 화살표를 클릭하면 관계 이름을 넣을 수 있어요')}}
    else if(!el||el.dataset.id===d.from){ // 빈 곳에 놓거나 ● 클릭 → 이어지는 새 항목
      const src=byId(d.from),sp=POS[d.from],p=toCanvas(e.clientX,e.clientY);
      const clicked=!!el||Math.hypot(p.x-(sp.x+NW),p.y-(sp.y+NH/2))<20;
      let yr=clicked?src.year+1:colAt(p.x);if(yr<=src.year)yr=p.x>sp.x+NW?src.year+1:src.year;
      const L=clicked?null:laneAt(p.y);
      const lane=L&&F.laneMode==='lane'&&L.key!==NOLANE?L.key:(F.laneMode==='lane'?src.lane:'');
      openEvent(null,yr,false,lane,d.from,D.free?(clicked?{x:sp.x+COLW,y:sp.y}:{x:p.x-NW/2,y:p.y-NH/2}):null);
    }
  }
});

let pendingFrom=null,pendingPos=null;
function openEvent(id,year,focusLinks,lane,from,pos){
  if(READONLY){if(id)openDetail(id);return}
  pendingFrom=id?null:(from||null);pendingPos=id?null:(pos||null);
  editingEv=id?byId(id):null;
  const e=editingEv||{year:year??'',when:'',title:'',cat:(from&&byId(from)?.cat)||D.cats[0]||'',imp:1,desc:'',people:[],places:[],note:'',lane:lane||'',links:[]};
  tmpLinks=e.links.map(l=>({...l}));tmpImgs.ev=[...(e.imgs||[])];renderImgs('ev');
  $('evTitle').textContent=tx(editingEv?'{item} 편집':'{item} 추가');
  $('f_cat').innerHTML=[...new Set([...D.cats,e.cat].filter(Boolean))].map(c=>`<option ${c===e.cat?'selected':''}>${esc(c)}</option>`).join('');
  $('f_year').value=e.year;$('f_when').value=e.when||'';$('f_title').value=e.title;$('f_imp').value=e.imp;$('f_lane').value=e.lane||'';
  $('f_desc').value=e.desc||'';tmpPeople=[...e.people];renderPChips();$('f_pin').value='';$('f_places').value=e.places.join(', ');$('f_note').value=e.note||'';
  $('evDel').style.display=editingEv?'':'none';
  renderLinks();openM('evModal');
  setTimeout(()=>{if(focusLinks){$('linkList').scrollIntoView({block:'center'});$('linkList').querySelector('input')?.focus()}else $(editingEv?'f_title':(year!=null?'f_title':'f_year')).focus()},30);
}
function renderLinks(){
  const me=editingEv?.id;
  const ins=me?D.events.filter(s=>s.links.some(l=>l.to===me)):[];
  const pf=pendingFrom&&byId(pendingFrom);if(pf)ins.push(pf);
  $('inList').innerHTML=ins.map(s=>`<div class="linkrow in"><span class="to">← ${esc(shortYear(s.year))} ${esc(s.title)}에서 이어짐</span></div>`).join('');
  $('linkList').innerHTML=tmpLinks.map((l,i)=>{const t=byId(l.to);return t?`<div class="linkrow"><span class="to">→ ${esc(shortYear(t.year))} ${esc(t.title)}</span><input value="${esc(l.label)}" placeholder="관계" oninput="tmpLinks[${i}].label=this.value"><button class="btn ghost sm" onclick="tmpLinks.splice(${i},1);renderLinks()">✕</button></div>`:''}).join('');
  const opts=[...D.events].filter(e=>e.id!==me&&!tmpLinks.some(l=>l.to===e.id)).sort((a,b)=>a.year-b.year);
  $('linkTo').innerHTML=`<option value="">${tx('결과 {item} 선택…')}</option>`+opts.map(e=>`<option value="${e.id}">${esc(shortYear(e.year))} · ${esc(e.title)}</option>`).join('');
}

function saveEvent(){
  const y=$('f_year').value,t=$('f_title').value.trim();
  if(y===''||!t){toast('연도와 제목을 입력하세요');return}
  const lane=$('f_lane').value.trim();
  const v={year:Math.round(+y),when:$('f_when').value.trim(),title:t,cat:$('f_cat').value,imp:+$('f_imp').value,desc:$('f_desc').value.trim(),people:(addPin(),[...tmpPeople]),places:splitList($('f_places').value),note:$('f_note').value.trim(),lane,links:tmpLinks.filter(l=>byId(l.to)),imgs:[...tmpImgs.ev]};

function fillIO(){

  if(ioFmt==='json'){const ids=usedImgs();const inc=$('ioImg').checked;let out={...D};if(inc){out.images={};ids.forEach(id=>{if(IMG[id])out.images[id]=IMG[id]})}

  else if(ioFmt==='md'){
    const line=e=>{const outs=e.links.map(l=>`→ ${byId(l.to)?.title}${l.label?` (${l.label})`:''}`).join(', ');return `- **${fmtYear(e.year)}${e.when?' '+e.when:''}** ${e.imp===3?'★ ':''}${e.title} [${e.cat}${e.lane?' / '+e.lane:''}]${e.desc?' — '+e.desc.replace(/\n/g,' '):''}${outs?`\n  - ${outs}`:''}\n`};
    let s=`# ${D.name||'연혁'}\n`;
    D.eras.forEach(er=>{s+=`\n## ${er.name} (${fmtYear(er.start)} ~ ${fmtYear(er.end)})\n${er.desc?er.desc+'\n':''}`;ev.filter(e=>e.year>=er.start&&e.year<=er.end).forEach(e=>s+=line(e))});
    const loose=ev.filter(e=>!eraOf(e.year));if(loose.length){s+=tx('\n## {era} 미지정\n');loose.forEach(e=>s+=line(e))}
    if(D.chars.length){s+=tx('\n# {who}\n');D.chars.forEach(c=>{s+=`\n## ${c.name}${c.role?` (${c.role})`:''}\n`;const m=[c.faction&&'소속: '+c.faction,lifeText(c)].filter(Boolean).join(' · ');if(m)s+=m+'\n';if(c.desc)s+=c.desc+'\n';
      c.rels.forEach(r=>{const t=charById(r.to);if(t)s+=`- ${r.label||'관계'}: ${t.name}\n`});
      ev.filter(e=>e.people.includes(c.name)).forEach(e=>{const a=ageAt(c,e.year);s+=`- ${fmtYear(e.year)}${a!=null?` (${a})`:''} ${e.title}\n`})})}

/* ---------- images ---------- */
const IMG={}; const tmpImgs={ev:[],char:[]}; const MAXIMG=12;
const IDB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('worldline-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
  st(m){return this.db.transaction('img',m).objectStore('img')},
  put(id,v){return new Promise(r=>{if(!this.db)return r(false);try{const q=this.st('readwrite').put(v,id);q.onsuccess=()=>r(true);q.onerror=()=>r(false)}catch(e){r(false)}})},
  del(id){return new Promise(r=>{if(!this.db)return r();try{const q=this.st('readwrite').delete(id);q.onsuccess=q.onerror=()=>r()}catch(e){r()}})},
  all(){return new Promise(r=>{const out={};if(!this.db)return r(out);try{const q=this.st('readonly').openCursor();q.onsuccess=()=>{const c=q.result;if(c){out[c.key]=c.value;c.continue()}else r(out)};q.onerror=()=>r(out)}catch(e){r(out)}})}};
function thumb(id){return id&&IMG[id]?IMG[id].thumb:''}
function full(id){return id&&IMG[id]?IMG[id].full:''}
function usedImgs(){return [...new Set([...D.events.flatMap(e=>e.imgs||[]),...D.chars.flatMap(c=>c.imgs||[])])]}
function dropImg(id){delete IMG[id];IDB.del(id)}
function avatar(c,sz,ring){const t=c&&c.imgs&&thumb(c.imgs[0]);const st=`width:${sz}px;height:${sz}px;${ring?'box-shadow:0 0 0 2px rgba(255,255,255,.7);margin-right:6px;':''}`;
  return t?`<img class="av" src="${t}" style="${st}" alt="">`:`<span class="av" style="${st}background:${c?.color||'#bbb'};font-size:${Math.max(8,sz*.45)}px">${esc((c?.name||'?').slice(0,1))}</span>`}
function draw(im,max,q){const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*s));c.height=Math.max(1,Math.round(im.naturalHeight*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function processFile(f){const url=URL.createObjectURL(f);try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});return {full:draw(im,1400,.85),thumb:draw(im,260,.8),name:f.name||''}}finally{URL.revokeObjectURL(url)}}
let imgTarget='ev', idbOK=true;
async function addFiles(files,k){
  const list=[...files].filter(f=>f.type&&f.type.startsWith('image/'));if(!list.length)return;
  const arr=tmpImgs[k];let skipped=0;
  for(const f of list){if(arr.length>=MAXIMG){skipped++;continue}
    try{const v=await processFile(f);const id='img_'+uid();IMG[id]=v;const ok=await IDB.put(id,v);if(!ok)idbOK=false;arr.push(id);renderImgs(k)}catch(e){toast('이미지를 읽을 수 없습니다: '+(f.name||''))}}
  if(skipped)toast(`이미지는 최대 ${MAXIMG}개까지 등록할 수 있습니다`);
  if(!idbOK)toast('이 브라우저에서는 이미지가 저장되지 않아 새로고침하면 사라집니다. 백업 데이터로 보관하세요');
}
function renderImgs(k){
  const box=$(k==='ev'?'f_imgs':'c_imgs'),arr=tmpImgs[k];
  box.innerHTML=arr.map((id,i)=>`<div class="ith" onclick="openLB(tmpImgs.${k},${i},'')">${thumb(id)?`<img src="${thumb(id)}" alt="">`:''}${i===0?`<span class="cv">${k==='ev'?'대표':'프로필'}</span>`:''}<span class="ia">${i>0?`<button title="대표로 지정" onclick="event.stopPropagation();moveImg('${k}',${i})">★</button>`:''}<button title="삭제" onclick="event.stopPropagation();tmpImgs.${k}.splice(${i},1);renderImgs('${k}')">✕</button></span></div>`).join('')
   +(arr.length<MAXIMG?`<div class="iadd" onclick="pickImg('${k}')"><b>＋</b>이미지 추가</div>`:'');
}
function moveImg(k,i){const a=tmpImgs[k];a.unshift(a.splice(i,1)[0]);renderImgs(k)}
function pickImg(k){imgTarget=k;$('imgFile').value='';$('imgFile').click()}
$('imgFile').onchange=e=>addFiles(e.target.files,imgTarget);
['f_imgs','c_imgs'].forEach(id=>{const el=$(id),k=el.dataset.k;
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drop')});
  el.addEventListener('dragleave',()=>el.classList.remove('drop'));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drop');addFiles(e.dataTransfer.files,k)})});
['evModal','charModal'].forEach(id=>{const m=$(id);m.addEventListener('dragover',e=>e.preventDefault());m.addEventListener('drop',e=>{e.preventDefault();addFiles(e.dataTransfer.files,id==='evModal'?'ev':'char')})});
document.addEventListener('paste',e=>{const k=$('evModal').classList.contains('show')?'ev':$('charModal').classList.contains('show')?'char':null;if(!k)return;
  const fs=[...(e.clipboardData?.items||[])].filter(i=>i.kind==='file'&&i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);if(fs.length){e.preventDefault();addFiles(fs,k)}});
// lightbox
let LB={ids:[],i:0,cap:''};
function openLB(ids,i,cap){ids=(ids||[]).filter(id=>IMG[id]);if(!ids.length)return;LB={ids,i:Math.min(i,ids.length-1),cap};hideTip();$('lb').classList.add('show');lbShow()}
function lbShow(){$('lbImg').src=full(LB.ids[LB.i]);$('lbCap').textContent=`${LB.cap?LB.cap+' · ':''}${LB.i+1} / ${LB.ids.length}`;
  document.querySelectorAll('#lb .nav').forEach(b=>b.style.display=LB.ids.length>1?'':'none');
  $('lbDots').innerHTML=LB.ids.length>1?LB.ids.map((id,i)=>`<img src="${thumb(id)}" class="${i===LB.i?'on':''}" onclick="LB.i=${i};lbShow()">`).join(''):''}
function lbGo(d){if(LB.ids.length<2)return;LB.i=(LB.i+d+LB.ids.length)%LB.ids.length;lbShow()}
function closeLB(){$('lb').classList.remove('show')}
function loadView(o){if(!o||!Array.isArray(o.events)){toast('보드 데이터 형식이 아닙니다');return}
  const im=o.images;delete o.images;if(im)Object.entries(im).forEach(([k,v])=>{if(v&&v.full)IMG[k]=v});o.cleaned=true;D=normalize(o);
  $('roNote').textContent='';render();requestAnimationFrame(fit)}
if(READONLY){document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{loadView(JSON.parse(r.result))}catch(err){toast('JSON 파일을 읽을 수 없습니다')}};r.readAsText(f)})}
function openFileView(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{loadView(JSON.parse(r.result))}catch(err){toast('JSON 파일을 읽을 수 없습니다')}};r.readAsText(f)};i.click()}
function goItem(id){closeM('detailModal');setView('flow');setTimeout(()=>jumpEv(id),60)}
function openDetail(id){const e=byId(id);if(!e)return;
  const ins=D.events.filter(s=>s.links.some(l=>l.to===id)),era=eraOf(e.year);
  const meta=[fmtYear(e.year)+(e.when?' '+e.when:''),era?.name,e.lane,e.cat,['','','주요','핵심'][e.imp]].filter(Boolean).map(esc).join(' · ');
  $('detailBody').innerHTML=`${e.imgs.length?`<div class="dt-imgs">${e.imgs.map((m,i)=>`<img src="${thumb(m)}" onclick="openLB(byId('${id}').imgs,${i},byId('${id}').title)">`).join('')}</div>`:''}
    <div class="dt-meta" style="--c:${catColor(e.cat)}">${meta}</div><h2>${e.imp===3?'★ ':''}${esc(e.title)}</h2>
    ${e.desc?`<p class="dt-desc">${esc(e.desc)}</p>`:''}
    ${e.people.length?`<h5>${tx('{who}')}</h5><div class="chips">${e.people.map(n=>{const c=charByName(n);return `<span class="chip" ${c?`onclick="openCharDetail('${c.id}')"`:''}>${avatar(c||{name:n,color:'#bbb'},16)} ${esc(n)}${c&&ageAt(c,e.year)!=null?` <small>${esc(ageAt(c,e.year))}</small>`:''}</span>`}).join('')}</div>`:''}
    ${e.places.length?`<h5>${tx('{tag}')}</h5><div class="chips">${e.places.map(p=>`<span class="tag">${esc(p)}</span>`).join(' ')}</div>`:''}
    ${e.note?`<h5>메모</h5><p class="dt-desc">${esc(e.note)}</p>`:''}
    ${ins.length||e.links.length?`<h5>흐름</h5>${ins.map(s=>`<div class="linkrow in" style="cursor:pointer" onclick="openDetail('${s.id}')"><span class="to">← ${esc(shortYear(s.year))} ${esc(s.title)}${(s.links.find(l=>l.to===id)||{}).label?` · ${esc(s.links.find(l=>l.to===id).label)}`:''}</span></div>`).join('')}${e.links.map(l=>{const t=byId(l.to);return t?`<div class="linkrow" style="cursor:pointer" onclick="openDetail('${t.id}')"><span class="to">→ ${esc(shortYear(t.year))} ${esc(t.title)}${l.label?` · ${esc(l.label)}`:''}</span></div>`:''}).join('')}`:''}`;
  $('detailFoot').innerHTML=`<button class="btn" onclick="goItem('${id}')">플로우에서 위치 보기</button><button class="btn primary" onclick="closeM('detailModal')">닫기</button>`;
  openM('detailModal');$('detailModal').querySelector('.modal').scrollTop=0}
function openCharDetail(cid){const c=charById(cid);if(!c)return;const evs=D.events.filter(e=>e.people.includes(c.name)).sort((a,b)=>a.year-b.year);
  $('detailBody').innerHTML=`<div class="ccard" style="--c:${c.color};border:none;padding:0;cursor:default"><div class="ch"><span ${c.imgs.length?`style="cursor:zoom-in" onclick="openLB(charById('${cid}').imgs,0,charById('${cid}').name)"`:''}>${avatar(c,72)}</span><div><h4 style="font-size:22px">${esc(c.name)}<small>${esc(c.faction||'')}</small></h4><div class="cm">${esc([c.role,lifeText(c)].filter(Boolean).join(' · '))}</div></div></div></div>
    ${c.desc?`<p class="dt-desc">${esc(c.desc)}</p>`:''}
    ${c.imgs.length>1?`<div class="dt-imgs">${c.imgs.slice(1).map((m,i)=>`<img src="${thumb(m)}" onclick="openLB(charById('${cid}').imgs,${i+1},charById('${cid}').name)">`).join('')}</div>`:''}
    ${c.rels.length?`<h5>관계</h5><div class="chips">${c.rels.map(r=>{const t=charById(r.to);return t?`<span class="chip" onclick="openCharDetail('${t.id}')">${avatar(t,16)} ${esc(t.name)} <small>${esc(r.label||'관계')}</small></span>`:''}).join('')}</div>`:''}
    ${evs.length?`<h5>${tx('관련 {item}')}</h5><div class="evlist">${evs.map(e=>{const a=ageAt(c,e.year);return `<div class="linkrow" onclick="openDetail('${e.id}')"><span class="yr">${shortYear(e.year)}</span><span class="to">${esc(e.title)}</span>${a!=null?`<span class="ag">${esc(a)}</span>`:''}</div>`}).join('')}</div>`:''}`;
  $('detailFoot').innerHTML=`<button class="btn" onclick="closeM('detailModal');F.focus=null;toggleFocus('${cid}');setView('flow')">흐름 보기</button><button class="btn primary" onclick="closeM('detailModal')">닫기</button>`;
  openM('detailModal');$('detailModal').querySelector('.modal').scrollTop=0}
async function downloadText(name,text,type){
  try{if(window.claude?.use){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:text});return true}}}catch(err){if(err&&/declin|cancel|abort/i.test(String(err.code||err.message||err)))return false}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return true}catch(err){toast('다운로드할 수 없습니다 — 복사 버튼을 이용하세요');return false}}
function downloadBoard(){const ids=usedImgs(),out={...D,images:{}};ids.forEach(id=>{if(IMG[id])out.images[id]=IMG[id]});downloadText('board.json',JSON.stringify(out))}
addEventListener('resize',syncHeaders);
render();
if(READONLY){document.body.classList.add('ro');
  fetch('board.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(o=>loadView(o)).catch(()=>{$('roNote').textContent='board.json을 찾지 못했습니다 — 백업 JSON 파일을 화면에 끌어다 놓으면 미리 볼 수 있어요';render()});
}else IDB.open().then(async ok=>{idbOK=ok;const all=await IDB.all();Object.assign(IMG,all);
  const used=new Set(usedImgs());Object.keys(all).forEach(id=>{if(!used.has(id))dropImg(id)}); // 정리: 쓰이지 않는 이미지
  render()});
requestAnimationFrame(()=>{const vp=$('vp');if(parseFloat($('canvas').style.width)>vp.clientWidth*1.6)setZoom(.85);});
</script>
</body>
